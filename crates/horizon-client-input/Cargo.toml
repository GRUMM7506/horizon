[package]
name = "horizon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
horizon-mod-api-macros = { path = "../horizon-mod-api-macros" }
horizon-engine-slots = { path = "../horizon-engine-slots" }
horizon-client-core = { path = "../horizon-client-core" }
winit = "0.30.13"
log = "0.4"
png = "0.18"

# arboard has no Android backend; clipboard.rs keeps copy and paste inside the game there.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

# Android: winit runs on a GameActivity (docs/android-port.md). Chosen here, in the lowest crate that
# uses winit, so every crate above builds for Android whichever of them cargo is asked for.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-game-activity"] }

[dev-dependencies]
# The window icon test decodes Horizon's icon.
horizon-theme = { path = "../horizon-theme" }

[features]
controllers = []

[lints]
workspace = true
